<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YuTube</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d12;color:#fff;font:15px system-ui,"Segoe UI",sans-serif;overflow:hidden}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
input{font:inherit;color:inherit}
#intro{position:fixed;inset:0;background:#0b0d12;z-index:99;display:grid;place-items:center;font-size:110px;font-weight:800;transition:opacity 1s}
#ch{display:inline-block;transition:transform 1.8s ease-in,opacity 1.8s}
#ch.zoom{transform:scale(45);opacity:0}
.spin{animation:sp .8s ease-in-out}
@keyframes sp{to{transform:rotateY(360deg)}}
header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0b0d12;z-index:5}
.logo{font-size:22px;font-weight:800}
.hr{display:flex;gap:18px;align-items:center}
#bp{width:34px;height:34px;border-radius:50%;overflow:hidden;display:grid;place-items:center}
#bp img{width:100%;height:100%;object-fit:cover}
#bar{position:fixed;top:0;left:0;right:0;height:56px;background:#0b0d12;z-index:8;display:none;align-items:center;gap:12px;padding:0 12px}
#bar.on{display:flex}
#qi{flex:1;background:#1a1e29;border:0;border-radius:20px;padding:9px 16px;outline:0}
#qi::placeholder{color:#8a90a2}
#ql{position:fixed;top:56px;left:0;right:0;z-index:8;background:#0b0d12;display:none}
#ql.on{display:block}
#ql div{padding:13px 20px;border-bottom:1px solid #1a1e29}
main{position:fixed;top:56px;bottom:68px;left:0;right:0;overflow-y:auto;padding:8px 12px 20px}
main h2{margin:4px 4px 12px}
.ld{position:absolute;inset:0;margin:auto;width:56px;height:56px;border:6px solid #1e3a8a;border-top-color:#2563eb;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.card{margin-bottom:20px;cursor:pointer}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#1a1e29;display:block}
.card h3{margin:8px 2px 2px;font-size:16px}
.card p,.mut{color:#8a90a2;font-size:13px;margin:0 2px}
.msg{text-align:center;color:#8a90a2;padding:60px 20px}
nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#0b0d12;border-top:1px solid #1a1e29;display:flex;justify-content:space-around;align-items:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;width:80px}
nav button.on{color:#3b82f6}
.add{width:50px;height:50px;border-radius:50%;border:3px solid #fff;position:relative}
.ic{position:relative;display:inline-block;width:26px;height:26px}
.ic::before,.ic::after,.add::before,.add::after,.x::before,.x::after,.pz::before,.pz::after{content:"";position:absolute}
.home::before{left:1px;top:1px;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:10px solid currentColor}
.home::after{left:5px;top:11px;width:16px;height:13px;background:currentColor;border-radius:0 0 3px 3px}
.fire::before{left:4px;top:1px;width:18px;height:24px;background:currentColor;border-radius:50% 50% 50% 50%/65% 65% 35% 35%}
.fire::after{left:9px;top:13px;width:8px;height:11px;background:#0b0d12;border-radius:50%}
.srch::before{left:2px;top:2px;width:17px;height:17px;border:3px solid #fff;border-radius:50%}
.srch::after{left:16px;top:20px;width:10px;height:3px;background:#fff;transform:rotate(45deg);transform-origin:left}
.add::before{left:11px;top:23px;width:20px;height:3px;background:#fff;top:20px;left:12px}
.add::after{left:20px;top:12px;width:3px;height:20px;background:#fff;left:20px}
.add::before{width:20px;height:3px;left:12px;top:20px}
.user::before{left:8px;top:1px;width:10px;height:10px;border-radius:50%;background:#fff}
.user::after{left:3px;top:13px;width:20px;height:11px;border-radius:10px 10px 2px 2px;background:#fff}
.like::before{left:3px;top:3px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:12px solid currentColor}
.like::after{left:8px;top:14px;width:10px;height:10px;background:currentColor;border-radius:0 0 3px 3px}
.dis{transform:rotate(180deg)}
.x{width:26px;height:26px;display:inline-block;position:relative}
.x::before,.x::after{left:2px;top:12px;width:22px;height:3px;background:#fff;transform:rotate(45deg);border-radius:2px}
.x::after{transform:rotate(-45deg)}
.sq{display:block;width:16px;height:16px;border:3px solid #fff;border-radius:3px}
.pz{display:block;position:relative;width:24px;height:26px}
.pz::before,.pz::after{top:2px;width:7px;height:22px;background:#fff;border-radius:2px;left:3px}
.pz::after{left:14px}
.pz.play::before{width:0;height:0;background:none;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;border-radius:0;left:4px;top:1px}
.pz.play::after{display:none}
.flip{display:block;width:26px;height:26px;border:3px solid #fff;border-top-color:transparent;border-radius:50%}
.ov{position:fixed;inset:0;background:#0b0d12;z-index:20;display:none;overflow-y:auto}
.ov.on{display:block}
.vw{position:relative;background:#000}
.vw video{width:100%;max-height:60vh;display:block;margin:auto}
.vw:fullscreen video{max-height:100vh;height:100%;object-fit:contain}
.pbtn{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:#000a;display:grid;place-items:center;opacity:0;transition:opacity .3s}
.vw.show .pbtn,.vw.paused .pbtn{opacity:1}
.fs{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:#000a;display:grid;place-items:center}
.info{padding:12px 16px}
.info h2{font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.row button{margin-left:14px}
.row .ic{color:#fff}
.md{position:fixed;inset:0;background:#000a;z-index:40;display:none;place-items:center;padding:16px}
.md.on{display:grid}
.box{background:#161a22;border-radius:18px;width:min(340px,100%);aspect-ratio:1;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative}
.box.wide{aspect-ratio:auto;max-height:85vh;overflow-y:auto;justify-content:flex-start}
.box h2{text-align:center;color:#fff}
.box input,.row2 input{background:#0b0d12;border:1px solid #2a2f3d;border-radius:10px;padding:11px 12px;width:100%}
.blue{background:#2563eb;color:#fff;border-radius:10px;padding:11px;font-weight:700}
.err{color:#f87171;font-size:13px;min-height:16px;text-align:center}
.sw{text-align:center;font-size:14px}
.sw a{color:#3b82f6;cursor:pointer}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.av{width:48px;height:48px;border-radius:50%;background:#2a2f3d;overflow:hidden;display:grid;place-items:center;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.box>button,.box>label{text-align:left;padding:11px 4px;border-bottom:1px solid #222735;cursor:pointer}
.row2{display:flex;gap:8px;padding:8px 0}
.hx{position:absolute;left:10px;top:10px}
.hl{margin-top:34px;overflow-y:auto}
.hl .card{display:flex;gap:10px;margin-bottom:12px}
.hl .card img{width:110px;flex:none}
#sh{background:#000;scroll-snap-type:y mandatory}
.si{position:relative;height:100vh;scroll-snap-align:start;background:#000;display:grid;place-items:center}
.si video{width:100%;height:100%;object-fit:contain}
.sb{position:absolute;right:12px;bottom:110px;display:flex;flex-direction:column;gap:22px;align-items:center;font-size:13px}
.sb button{display:flex;flex-direction:column;align-items:center;gap:4px}
.st{position:absolute;left:14px;bottom:36px;right:80px;text-shadow:0 1px 4px #000}
.big{position:absolute;inset:0;margin:auto;width:90px;height:90px;pointer-events:none;opacity:0;color:#fff}
.big .ic{transform:scale(3.4);transform-origin:top left}
.big.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(40px) scale(.6)}25%{opacity:1;transform:translateY(0) scale(1)}70%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-30px)}}
#cam{background:#000}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#tm{position:absolute;top:18px;left:0;right:0;text-align:center;font-weight:700;font-size:18px}
.cb{position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:center;align-items:center}
.rec{width:72px;height:72px;border-radius:50%;background:#2563eb;border:4px solid #fff;display:grid;place-items:center}
.rec i{display:none;width:26px;height:26px;background:#fff;border-radius:4px}
.rec.on i{display:block}
.cb .flip{position:absolute;right:30px}
.cx{position:absolute;left:14px;top:14px}
.ed{display:flex;flex-direction:column;gap:16px;padding:60px 18px;max-width:520px;margin:auto}
.ed .r{display:flex;gap:12px;align-items:center}
.ed img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:#1a1e29}
.ed input{flex:1;background:none;border:0;border-bottom:1px solid #2a2f3d;padding:10px 4px;outline:0}
.ed input::placeholder{color:#8a90a2}
.pub{background:#fff;color:#000;font-weight:700;border-radius:12px;padding:13px}
#tt{position:fixed;top:40%;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:16px 22px;border-radius:14px;z-index:60;text-align:center;display:none;max-width:86vw;font-weight:600}
#sh .cx{position:fixed}
@media(min-width:900px){
header{padding:0 28px}
nav{top:56px;bottom:0;right:auto;width:96px;height:auto;flex-direction:column;justify-content:flex-start;gap:26px;padding-top:24px;border-top:0;border-right:1px solid #1a1e29}
main{left:96px;bottom:0;padding:16px 28px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-content:start}
main>*:not(.card){grid-column:1/-1}
main .card{margin:0}
#pl>.vw,#pl>.info{max-width:980px;margin-left:auto;margin-right:auto}
.vw video{max-height:70vh}
.si{width:min(440px,100%);margin:0 auto}
}

:root{color-scheme:dark}
html,body,header,#bar,#ql,nav,.ov{background:#0f0f0f}
header{padding:0 14px 0 12px}
.logo{display:flex;align-items:center;gap:6px;font-size:21px;letter-spacing:-1px}
.logo i{width:34px;height:24px;background:#f00;border-radius:7px;position:relative;display:inline-block}
.logo i::after{content:"";position:absolute;left:13px;top:6px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.hr{gap:22px}.hr .ic{color:#fff}
nav{height:64px;border-top:1px solid #272727}
nav button{flex:1;width:auto;font-size:11px;color:#f1f1f1}
nav button.on span:last-child{font-weight:700}
nav .add{flex:none;width:54px;height:54px;border:0;background:#272727;margin:0 4px}
.add::before{left:17px;top:25px;width:20px;height:3px}
.add::after{left:25px;top:17px;width:3px;height:20px}
nav #bp{width:auto;height:auto;border-radius:0;overflow:visible;display:flex}
.na{width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#272727}
.na img{width:100%;height:100%;object-fit:cover}
.shr::before{left:5px;top:1px;width:16px;height:24px;border:3px solid currentColor;border-radius:6px}
.shr::after{left:10px;top:9px;border-left:7px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
.sbs::before{left:1px;top:5px;width:24px;height:17px;border:3px solid currentColor;border-radius:4px}
.sbs::after{left:10px;top:9px;border-left:7px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
.bell::before{left:4px;top:3px;width:18px;height:16px;border:3px solid #fff;border-radius:9px 9px 2px 2px}
.bell::after{left:9px;top:21px;width:8px;height:4px;background:#fff;border-radius:0 0 4px 4px}
.gear::before{left:1px;top:1px;width:24px;height:24px;border:4px dotted #fff;border-radius:50%}
.gear::after{left:8px;top:8px;width:10px;height:10px;border:3px solid #fff;border-radius:50%}
main{padding:0 0 24px;bottom:64px}
.chips,.subr,.sr{display:flex;overflow-x:auto;scrollbar-width:none}
.chips{gap:8px;padding:10px 12px}
.chip{background:#272727;color:#f1f1f1;border-radius:9px;padding:7px 14px;font-weight:600;white-space:nowrap}
.chip.on{background:#f1f1f1;color:#0f0f0f}
.subr{gap:16px;padding:10px 12px 0}
.sub-ch{flex:none;width:76px;text-align:center;font-size:13px;cursor:pointer}
.sub-ch .av{width:68px;height:68px;margin:0 auto 6px}
.sub-ch span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{margin:0 0 18px}
.card .th{position:relative}
.card .th img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:0;background:#272727}
.card .av img{border-radius:0;aspect-ratio:auto}
.du{position:absolute;right:8px;bottom:8px;background:#000c;border-radius:5px;padding:1px 6px;font-size:12px;font-weight:600}
.cm{display:flex;gap:12px;padding:12px 12px 0;align-items:flex-start}
.av.sm{width:38px;height:38px}
.tx{flex:1;min-width:0}
.card h3{margin:0 0 3px;font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0;color:#aaa;font-size:13px}
.dots{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 -7px #fff,0 7px #fff;margin:12px 8px 0 4px;flex:none}
.shelf{padding:4px 0 14px}
.shelf h2{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:20px;margin:0}
.sicon{width:26px;height:28px;background:#f33;border-radius:8px;position:relative;display:inline-block}
.sicon::after{content:"";position:absolute;left:9px;top:8px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.sr{gap:10px;padding:0 12px}
.sc{flex:none;width:44vw;max-width:220px;aspect-ratio:9/16;border-radius:12px;overflow:hidden;position:relative;margin:0;background:#272727}
.sc img{width:100%;height:100%;object-fit:cover;aspect-ratio:auto;border-radius:0}
.sc b{position:absolute;left:10px;right:10px;bottom:10px;font-size:14px;text-shadow:0 1px 4px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr .card:not(.sc){flex:none;width:230px;margin:0}
.sr .card:not(.sc) .cm{padding:8px 0 0}
.you{padding:6px 14px 20px}
.yt{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.you .ph{gap:16px}
.you h2{font-size:26px;margin:0}
.big2{width:84px;height:84px}
.vc{width:100%;padding:12px;border-radius:24px;background:#f1f1f1;color:#0f0f0f;font-weight:700;margin:16px 0 22px}
.sh2{margin:6px 0 10px!important;font-size:20px!important}
.hl .card{margin-bottom:12px}
@media(min-width:900px){
nav button{flex:none;width:auto}
nav .add{margin:0}
.card .th img{border-radius:12px}
}
.avpick{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:0!important}
.ed textarea{width:100%;background:none;border:0;border-bottom:1px solid #2a2f3d;color:#fff;padding:10px 4px;outline:0;resize:none;font:inherit}
.ed textarea::placeholder{color:#8a90a2}

/* ====== новые разделы в прежнем стиле ====== */
.lvic::before{left:3px;top:3px;width:20px;height:20px;border:3px solid currentColor;border-radius:50%}
.lvic::after{left:10px;top:10px;width:6px;height:6px;background:currentColor;border-radius:50%}
.pst::before{left:2px;top:3px;width:22px;height:20px;border:3px solid currentColor;border-radius:5px}
.pst::after{left:8px;top:9px;width:10px;height:2px;background:currentColor;box-shadow:0 5px currentColor}
.card{content-visibility:auto;contain-intrinsic-size:auto 300px}
.fx{font-size:20px;color:#fff}
.phd{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 8px}
.pbtn2{padding:10px 18px!important;font-size:14px}
.post{margin:10px 12px 14px;background:#161616;border-radius:14px;padding:12px 12px 8px;content-visibility:auto;contain-intrinsic-size:auto 260px}
.post .cm{padding:0 0 8px}
.pt{white-space:pre-wrap;word-break:break-word;line-height:1.45;padding:2px 2px 10px}
.pi{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.pa{display:flex;padding:2px 0}
.pa button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:#272727;color:#f1f1f1;font-weight:600}
.pa button.liked{background:#2563eb;color:#fff}
.pa .ic{transform:scale(.8)}
.ptx{width:100%;background:#0b0d12;border:1px solid #2a2f3d;border-radius:10px;padding:11px 12px;color:#fff;outline:0;resize:none;font:inherit}
.lv{display:flex;gap:12px;align-items:center;margin:10px 12px;padding:12px;background:#161616;border-radius:14px;cursor:pointer}
.lv .tx p{color:#aaa;font-size:13px}
.livebadge{background:#e00;color:#fff;font-weight:700;font-size:11px;letter-spacing:.5px;padding:3px 8px;border-radius:5px;margin-left:auto}
.lvw{position:relative;height:100%;background:#000}
.lvw video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.lvs{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;pointer-events:none;text-align:center;padding:30px}
.lvt{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(#000b,transparent)}
.lvt .livebadge{margin:0}
.lvh{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx2{width:36px;height:36px;border-radius:50%;background:#0009;display:grid;place-items:center;flex:none}
.lvc{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000c 40%)}
#lch{max-height:30vh;overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:5px;padding:30px 0 8px;scrollbar-width:none;text-shadow:0 1px 3px #000}
#lch b{color:#8ab4ff}
.lvi2{display:flex;gap:8px}
.lvi2 input{flex:1;background:#0009;border:1px solid #ffffff2a;border-radius:22px;padding:11px 16px;outline:0;color:#fff}
.lvi2 button{width:44px;border-radius:50%;background:#2563eb;font-size:16px}
#dr{position:fixed;left:12px;right:12px;bottom:76px;z-index:70;background:#272727;border:1px solid #f87171;border-radius:14px;padding:12px 14px}
.drt{font-size:14px;margin-bottom:10px;line-height:1.35}
.drb{display:flex;gap:8px}
.drb button{background:#ffffff14;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px}
.drb button:first-child{background:#2563eb}
.drb button:last-child{margin-left:auto}
@media(min-width:900px){.post,.lv{max-width:640px;margin-left:auto;margin-right:auto}.phd{max-width:640px;margin:0 auto}}
</style>
</head>
<body>
<div id="intro"><span id="ch">Y</span></div>
<header><b class="logo"><i></i>YuTube</b><div class="hr"><button id="bn" aria-label="Уведомления"><i class="ic bell"></i></button><button id="bs" aria-label="Поиск"><i class="ic srch"></i></button></div></header>
<div id="bar"><button id="bx" aria-label="На главную"><i class="x"></i></button><input id="qi" placeholder="Поиск на YuTube" autocomplete="off"></div>
<div id="ql"></div>
<main id="main"></main>
<nav>
  <button data-t="home" class="on"><i class="ic home"></i><span>Главная</span></button>
  <button data-t="shorts"><i class="ic shr"></i><span>Shorts</span></button>
  <button id="ba" class="add" aria-label="Снять видео"></button>
  <button data-t="live"><i class="ic lvic"></i><span>Эфир</span></button>
  <button data-t="posts"><i class="ic pst"></i><span>Посты</span></button>
  <button id="bp" data-t="you"><span class="na"><i class="ic user"></i></span><span>Вы</span></button>
</nav>
<div id="lv" class="ov"></div><div id="pl" class="ov"></div><div id="sh" class="ov"></div><div id="cam" class="ov"></div>
<div id="au" class="md"></div><div id="hs" class="md"></div><div id="pf" class="md"></div>
<div id="tt"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

async function load(fn) {
  const t = ++tok, t0 = Date.now(), m = $('#main');
  m.innerHTML = '<div class="ld"></div>';
  while (Date.now() - t0 < LOAD_MS || !Object.keys(V).length) { await sleep(250); if (t !== tok) return; }

}
const ago = t => { const d = (Date.now() - (t || 0)) / 6e4; return d < 60 ? Math.max(1, Math.floor(d)) + ' мин назад' : d < 1440 ? Math.floor(d / 60) + ' ч назад' : Math.floor(d / 1440) + ' д назад'; };
const mmss = s => Math.floor((s || 0) / 60) + ':' + String(Math.round((s || 0) % 60)).padStart(2, '0');
const card = id => { const v = V[id]; return `<div class="card" data-id="${id}"><div class="th"><img loading="lazy" decoding="async" src="${v.thumb || ''}" alt=""><span class="du">${mmss(v.dur)}</span></div><div class="cm"><div class="av sm">${avatarHtml(v.uid)}</div><div class="tx"><h3>${esc(v.title)}</h3><p>${esc(chName(v))} · ▷${fmt(v.views || 0)} · ${ago(v.created)}</p></div><i class="dots"></i></div></div>`; };

const shelf = list => list.length ? `<div class="shelf"><h2><i class="sicon"></i>Shorts</h2><div class="sr">${list.map(id => `<div class="sc card" data-id="${id}"><img src="${V[id].thumb || ''}" alt=""><b>${esc(V[id].title)}</b></div>`).join('')}</div></div>` : '';
const trendOk = i => { const v = V[i]; return (v.views || 0) >= 5e5 && (v.likes || 0) >= 1000 && subsN(v.uid) < 2000; };
function feed(m) {
  const all = ids(), longs = all.filter(i => !isShort(V[i])), sh = all.filter(i => isShort(V[i]));
  const subs = me ? Object.keys(U).filter(u => (U[u].subs || {})[me.uid]) : [];
  let body;
  if (chip === 'trend') body = all.filter(trendOk).map(card).join('') || '<div class="msg">Пока нет видео в тренде</div>';

  else if (chip === 'video') body = longs.map(card).join('') || '<div class="msg">Видео пока нет</div>';

/* ---------- Реакции, просмотры, история ---------- */
function react(id, k) {
  if (!me) return authUI('in');
  if (voted.has(id + k)) return; voted.add(id + k);
  runTransaction(ref(db, `videos/${id}/${k}`), n => (n || 0) + 1);
}
function seen(id) {
  runTransaction(ref(db, `videos/${id}/views`), n => (n || 0) + 1).catch(() => {});
  if (me) set(ref(db, `users/${me.uid}/history/${id}`), Date.now());
}

function player(id) {

  const recs = ids().filter(i => i !== id).map(card).join('');
  p.innerHTML = `<div class="vw show"><video playsinline autoplay loop preload="metadata"></video><button class="pbtn" aria-label="Пауза"><i class="pz"></i></button><button class="fs" aria-label="Во весь экран"><i class="sq"></i></button></div>

  <div class="row"><b class="chn" data-u="${v.uid}">${esc(chName(v))}</b><span><button data-r="likes" aria-label="Нравится"><i class="ic like"></i></button><button data-r="dislikes" aria-label="Не нравится"><i class="ic like dis"></i></button></span></div>
  <h3 style="margin:14px 0 10px">Рекомендации</h3>${recs}</div>`;
  p.classList.add('on'); p.scrollTop = 0;
  const w = p.querySelector('.vw'), vid = w.querySelector('video'), pz = w.querySelector('.pz');
  vsrc(id).then(u => { if (vid.isConnected) { vid.src = u; vid.play().catch(() => {}); } }).catch(() => toast('Не удалось загрузить видео'));
  const sync = () => { pz.classList.toggle('play', vid.paused); w.classList.toggle('paused', vid.paused); };
  vid.onplay = vid.onpause = sync;
  w.onclick = e => {
    if (e.target.closest('.fs')) { fullscreen(w, vid); return; }
    vid.paused ? vid.play() : vid.pause();
    w.classList.add('show'); clearTimeout(w.t); w.t = setTimeout(() => w.classList.remove('show'), 1500);
  };
  let y0 = 0;
  w.ontouchstart = e => y0 = e.touches[0].clientY;
  w.ontouchend = e => {
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dy) < 80) return;
    if (dy < 0 && document.fullscreenElement) document.exitFullscreen();
    if (dy > 0) { if (document.fullscreenElement) document.exitFullscreen(); closePlayer(); }
  };
  p.onclick = e => {
    const r = e.target.closest('[data-r]'); if (r) react(id, r.dataset.r);
    const c = e.target.closest('.chn'); if (c) { closePlayer(); channel(c.dataset.u); }
  };
}
function closePlayer() { const p = $('#pl'); p.querySelectorAll('video').forEach(v => v.pause()); p.classList.remove('on'); p.innerHTML = ''; }
async function fullscreen(w, vid) {
  try {
    await w.requestFullscreen();
    await screen.orientation.lock(vid.videoWidth >= vid.videoHeight ? 'landscape' : 'portrait');
  } catch (e) {}
}

/* ---------- Shorts ---------- */
function shorts(startId) {
  const s = $('#sh'), list = ids().filter(i => isShort(V[i]));
  const k = Math.max(0, list.indexOf(startId));
  const order = [...list.slice(k), ...list.slice(0, k)];
  s.innerHTML = '<button class="cx" style="z-index:3" aria-label="Закрыть"><i class="x"></i></button>';
  s.classList.add('on');
  const add = () => order.forEach(id => {
    const v = V[id], d = document.createElement('div'); d.className = 'si'; d.dataset.id = id;
    d.innerHTML = `<video playsinline loop preload="none"></video><div class="big"><i class="ic like"></i></div>
    <div class="sb"><button data-r="likes" aria-label="Нравится"><i class="ic like"></i>${fmt(v.likes || 0)}</button><button data-r="dislikes" aria-label="Не нравится"><i class="ic like dis"></i></button></div>
    <div class="st"><b>${esc(chName(v))}</b><div>${esc(v.title)}</div></div>`;
    s.appendChild(d); io.observe(d);
  });
  const io = new IntersectionObserver(es => es.forEach(e => {
    const vid = e.target.querySelector('video');
    if (e.isIntersecting) {
      ensureSrc(vid, e.target.dataset.id).then(() => vid.play().catch(() => {})); seen(e.target.dataset.id);
      if (e.target === s.lastElementChild) add();
    } else vid.pause();
  }), {root: s, threshold: .7});
  s._io = io; add();
  let last = 0;
  s.onclick = e => {
    if (e.target.closest('.cx')) { io.disconnect(); s.querySelectorAll('video').forEach(v => v.pause()); s.classList.remove('on'); if (tab === 'shorts') go('home'); return; }
    const r = e.target.closest('[data-r]'), it = e.target.closest('.si'); if (!it) return;
    if (r) return react(it.dataset.id, r.dataset.r);
    const now = Date.now(), vid = it.querySelector('video');
    if (now - last < 300) {
      clearTimeout(s.t); const b = it.querySelector('.big'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
      react(it.dataset.id, 'likes');
    } else s.t = setTimeout(() => vid.paused ? vid.play() : vid.pause(), 300);
    last = now;
  };
}

/* ---------- Вход через S Account ---------- */
const SACCOUNT_URL = 'https://voco-code.github.io/saccount/'; // адрес страницы S Account
const SA_ORIGIN = new URL(SACCOUNT_URL).origin;
let reqId = null;
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('yutube-saccount') : null;
function openSA() {
  reqId = String(Math.floor(Math.random() * 9e11) + 1e11); // Id запроса, 12 цифр
  window.open(`${SACCOUNT_URL}?service=yutube&Id=${reqId}`, '_blank');
  toast('Войдите в S Account, затем вернитесь в YuTube');
}
function authUI() {
  if (navigator.userActivation && navigator.userActivation.isActive) return openSA();
  const a = $('#au');
  a.innerHTML = '<div class="box"><h2>Вход</h2><p class="mut" style="text-align:center">Перейдите в свой S Account</p><button class="blue" id="go">Перейти</button></div>';
  a.classList.add('on');
  a.onclick = e => { if (e.target === a) a.classList.remove('on'); };
  $('#go').onclick = () => { a.classList.remove('on'); openSA(); };
}
async function onSA(d) {
  if (!d || d.type !== 'saccount:login' || !reqId || String(d.id) !== reqId || !d.email || !d.password) return;
  reqId = null; $('#au').classList.remove('on');
  let cred;
  try {
    try { cred = await signInWithEmailAndPassword(auth, d.email, d.password); }
    catch (e) { cred = await createUserWithEmailAndPassword(auth, d.email, d.password); }
  } catch (e) { return toast(e.code === 'auth/email-already-in-use' ? 'Пароль в YuTube не совпадает с паролем S Account' : 'Не удалось войти в YuTube (' + (e.code || 'ошибка') + ')'); }
  me = cred.user;
  const s = await get(ref(db, 'users/' + me.uid));
  if (!s.exists() || !s.val().channel) createChannel({name: d.name, nick: d.nick}); else { toast('Вы вошли'); go('home'); }
}
window.addEventListener('message', e => { if (e.origin === SA_ORIGIN) onSA(e.data); });
if (bc) bc.onmessage = e => onSA(e.data);

function cropAvatar(f) {
  return new Promise(res => {
    const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 128; const k = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, 128, 128); res(c.toDataURL('image/jpeg', .8));
    }; img.src = URL.createObjectURL(f);
  });
}
function createChannel(pre = {}) {

  <input id="ccn" placeholder="Название канала" maxlength="80" value="${esc(u.channel || pre.name || '')}">

  <div class="err"></div><button class="blue" id="csv">Создать канал</button></div>`;
  p.classList.add('on');
  p.onclick = e => { if (e.target === p) p.classList.remove('on'); };

  $('#csv').onclick = async () => {

    await update(ref(db, 'users/' + me.uid), {channel: name, handle: '@' + nick, avatar: av, desc: u.desc || ''});

  p.innerHTML = `<div class="box wide"><div class="ph"><div class="av">${avatarHtml(me.uid)}</div><div><b>${esc(u.channel)}</b><div class="mut">${esc(u.handle)}</div></div></div>
  <button data-a="my">Мой канал</button><button data-a="hist">История просмотра</button>
  <label>Сменить аватарку<input type="file" accept="image/*" hidden id="af"></label>
  <div class="row2"><input id="cn" value="${esc(u.channel)}" placeholder="Название канала"><button class="blue" data-a="save" style="padding:0 14px">Сохранить</button></div>
  <button data-a="out">Выйти</button></div>`;
  p.classList.add('on');
  p.onclick = async e => {
    if (e.target === p) return p.classList.remove('on');

    if (a === 'out') { await signOut(auth); p.classList.remove('on'); go('home'); }
  };
  $('#af').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const s = Math.min(img.width, img.height); c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
      update(ref(db, 'users/' + me.uid), {avatar: c.toDataURL('image/jpeg', .8)}).then(profile);
    }; img.src = URL.createObjectURL(f);

function channel(uid) {

  const list = ids().filter(i => V[i].uid === uid);
  const m = $('#main'); tok++; closeSearch();
  m.innerHTML = `<div style="text-align:center;padding:10px"><div class="av" style="width:84px;height:84px;margin:auto">${avatarHtml(uid)}</div><h2 style="margin:10px 0 2px">${esc(u.channel)}</h2><div class="mut">${esc(u.handle)} · ${fmt(subsN(uid))} подписчиков</div><p style="margin:10px 0">${esc(u.desc)}</p>
  ${mine ? '<button class="blue" id="set" style="padding:10px 26px">Настройки аккаунта</button>' : `<button class="blue" id="sub" style="padding:10px 26px">${subbed ? 'Вы подписаны' : 'Подписаться'}</button>`}</div>${list.length ? list.map(card).join('') : '<div class="msg">Видео пока нет</div>'}`;
  const st = $('#set'); if (st) st.onclick = profile;
  const b = $('#sub'); if (b) b.onclick = () => { if (!me) return authUI('in'); set(ref(db, `users/${uid}/subs/${me.uid}`), subbed ? null : true).then(() => channel(uid)); };
}
function history() {
  const h = (U[me.uid] || {}).history || {}, h2 = $('#hs');
  const list = Object.keys(h).sort((a, b) => h[b] - h[a]).filter(i => V[i]);
  h2.innerHTML = `<div class="box wide"><button class="hx" aria-label="Закрыть" style="border:0"><i class="x"></i></button><div class="hl">${list.length ? list.map(card).join('') : '<div class="msg">История пуста</div>'}</div></div>`;
  h2.classList.add('on');
  h2.onclick = e => { if (e.target === h2) h2.classList.remove('on'); if (e.target.closest('.hx')) { h2.classList.remove('on'); go('home'); } };
}

/* ---------- Камера и публикация ---------- */
let stream, rec, chunks, facing = 'user', t0, tick;
const cam = $('#cam');
async function startStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facing}, audio: true});
  cam.querySelector('video').srcObject = stream;
}
async function openCam() {
  cam.innerHTML = `<video autoplay muted playsinline></video><button class="cx" aria-label="Закрыть"><i class="x"></i></button><div id="tm">0:00</div><div class="cb"><button class="rec" aria-label="Запись"><i></i></button><button class="flip" id="fl" aria-label="Перевернуть камеру"></button></div>`;
  cam.classList.add('on');
  try { await startStream(); } catch (e) { closeCam(); return toast('Нет доступа к камере'); }
  cam.querySelector('.cx').onclick = closeCam;
  $('#fl').onclick = async () => { if (rec && rec.state === 'recording') return; facing = facing === 'user' ? 'environment' : 'user'; try { await startStream(); } catch (e) {} };
  cam.querySelector('.rec').onclick = e => rec && rec.state === 'recording' ? rec.stop() : record(e.currentTarget);
}
function closeCam() { clearInterval(tick); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; cam.classList.remove('on'); cam.innerHTML = ''; }
function record(btn) {
  chunks = []; rec = new MediaRecorder(stream, {videoBitsPerSecond: 1000000});
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { clearInterval(tick); const dur = Math.min(15, Math.round((Date.now() - t0) / 1000)); editor(new Blob(chunks, {type: rec.mimeType || 'video/webm'}), dur, snap()); };
  rec.start(); t0 = Date.now(); btn.classList.add('on');
  tick = setInterval(() => {
    const s = (Date.now() - t0) / 1000;
    $('#tm').textContent = '0:' + String(Math.min(15, Math.floor(s))).padStart(2, '0');
    if (s >= 15) rec.stop();
  }, 200);
}
function thumbOf(blob) {
  return new Promise(res => {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.src = URL.createObjectURL(blob);
    v.onloadeddata = () => { v.currentTime = 0.2; };
    v.onseeked = () => {
      const c = document.createElement('canvas'), w = 360; c.width = w; c.height = Math.round(w * (v.videoHeight || 9) / (v.videoWidth || 16));
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .7));
    };
    v.onerror = () => res('');
  });
}
function snap() {
  const v = cam.querySelector('video'); if (!v || !v.videoWidth) return '';
  const c = document.createElement('canvas'); c.width = 360; c.height = Math.round(360 * v.videoHeight / v.videoWidth);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .7);
}
function editor(blob, dur, th) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  cam.innerHTML = `<button class="cx" id="edx" aria-label="Закрыть"><i class="x"></i></button><div class="ed"><div class="r"><img src="${th}" alt=""><input id="ti" placeholder="Впишите название видео" maxlength="100"></div><textarea id="td" rows="4" maxlength="2000" placeholder="Описание"></textarea><input id="tg" maxlength="200" placeholder="Теги через запятую"><button class="pub">Публиковать</button></div>`;
  cam.style.background = '#0b0d12';
  $('#edx').onclick = () => { closeCam(); cam.style.background = ''; };
  cam.querySelector('.pub').onclick = () => {
    const tags = $('#tg').value.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean).slice(0, 10).join(', ');
    pending = {blob, dur, th, title: $('#ti').value.trim() || 'Без названия', desc: $('#td').value.trim(), tags};
    cam.classList.remove('on'); cam.innerHTML = ''; cam.style.background = ''; go('home'); publish();
  };
}
/* ---------- Видео из базы: куски + кэш ---------- */
const CH = 700000, vcache = new Map();
async function vsrc(id) {
  if (vcache.has(id)) return vcache.get(id);
  let data = (V[id] || {}).video;
  if (!data) { const s = await get(ref(db, 'vdata/' + id)), a = s.val() || []; data = (Array.isArray(a) ? a : Object.values(a)).join(''); }
  if (!data) throw new Error('empty');
  const u = URL.createObjectURL(await (await fetch(data)).blob());
  vcache.set(id, u); return u;
}
function ensureSrc(vid, id) { return vid.getAttribute('src') ? Promise.resolve() : vsrc(id).then(u => { vid.src = u; }).catch(() => toast('Не удалось загрузить видео')); }

/* ---------- Черновик и публикация ---------- */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('yutube', 1); r.onupgradeneeded = () => r.result.createObjectStore('d'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dput = async (k, v) => { try { const d = await idb(); d.transaction('d', 'readwrite').objectStore('d').put(v, k); } catch (e) {} };
const dget = async k => { try { const d = await idb(); return await new Promise(r => { const q = d.transaction('d').objectStore('d').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(); }); } catch (e) {} };
const ddel = async k => { try { const d = await idb(); d.transaction('d', 'readwrite').objectStore('d').delete(k); } catch (e) {} };
const errText = e => (e && (e.message || e.code)) || 'неизвестная ошибка';
const hideDraft = () => { const d = $('#dr'); if (d) d.remove(); };
function showDraft(msg) {
  let d = $('#dr'); if (!d) { d = document.createElement('div'); d.id = 'dr'; document.body.appendChild(d); }
  d.innerHTML = `<div class="drt">⚠ ${esc(msg)}</div><div class="drb"><button data-d="retry">Повторить</button><button data-d="save">Скачать видео</button><button data-d="x">✕</button></div>`;
  d.onclick = e => {
    const a = e.target.dataset.d;
    if (a === 'retry') publish();
    if (a === 'save' && pending) { const l = document.createElement('a'); l.href = URL.createObjectURL(pending.blob); l.download = 'video.' + (pending.blob.type.includes('mp4') ? 'mp4' : 'webm'); l.click(); }
    if (a === 'x') d.remove();
  };
}
let busy = false;
async function publish() {
  if (!pending || busy) return;
  await authReady;
  if (!me) { authUI('in'); return; }
  busy = true; hideDraft();
  const p = pending, id = push(ref(db, 'videos')).key;
  await dput('draft', p); // видео сохранено на устройстве, пока не отправится
  try {
    toast('Отправляю видео… 0%', 60000);
    const data = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(p.blob); });
    const n = Math.ceil(data.length / CH);
    for (let i = 0; i < n; i++) {
      await set(ref(db, `vdata/${id}/${i}`), data.slice(i * CH, (i + 1) * CH));
      toast(`Отправляю видео… ${Math.round((i + 1) / n * 95)}%`, 60000);
    }
    await set(ref(db, 'videos/' + id), {title: p.title, uid: me.uid, thumb: p.th, dur: p.dur, chunks: n, views: 0, likes: 0, dislikes: 0, created: Date.now(), desc: p.desc || '', tags: p.tags || ''});
    pending = null; ddel('draft'); toast('Видео опубликовано 🎉');
  } catch (e) {
    remove(ref(db, 'vdata/' + id)).catch(() => {});
    toast('Не отправилось: ' + errText(e), 6000);
    showDraft('Видео не отправлено (' + errText(e) + '). Оно сохранено у вас.');
  }
  busy = false;
}
dget('draft').then(d => { if (d && d.blob && !pending) { pending = d; showDraft('Есть неотправленное видео'); } });

/* миграция старых видео (лежали внутри ленты и тормозили её) */
let mig = false, migFail = 0;
setInterval(async () => {
  if (mig || !me || migFail > 2) return;
  const id = Object.keys(V).find(i => V[i].uid === me.uid && V[i].video); if (!id) return;
  mig = true;
  try {
    const data = V[id].video, n = Math.ceil(data.length / CH);
    for (let i = 0; i < n; i++) await set(ref(db, `vdata/${id}/${i}`), data.slice(i * CH, (i + 1) * CH));
    await update(ref(db, 'videos/' + id), {video: null, chunks: n});
  } catch (e) { migFail++; }
  mig = false;
}, 5000);

/* ---------- Меню «Создать» ---------- */
$('#ba').onclick = () => {
  const p = $('#pf');
  p.innerHTML = '<div class="box wide"><h2 class="fx">Создать</h2><button data-m="v">🎬 Снять видео</button><button data-m="p">✍️ Написать пост</button><button data-m="l">🔴 Выйти в эфир</button></div>';
  p.classList.add('on');
  p.onclick = e => { if (e.target === p) return p.classList.remove('on'); const a = e.target.dataset.m; if (!a) return; p.classList.remove('on'); ({v: openCam, p: composePost, l: startLive})[a](); };
};

/* ---------- Посты ---------- */
const resizeImg = (f, max) => new Promise(res => { const i = new Image(); i.onload = () => { const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .75)); }; i.src = URL.createObjectURL(f); });
const postCard = id => { const p = P[id]; return `<article class="post"><div class="cm"><div class="av sm" data-u="${p.uid}">${avatarHtml(p.uid)}</div><div class="tx"><b>${esc((U[p.uid] || {}).channel || 'Канал')}</b><p>${ago(p.created)}</p></div></div>${p.text ? `<div class="pt">${esc(p.text)}</div>` : ''}${p.img ? `<img class="pi" loading="lazy" decoding="async" src="${p.img}" alt="">` : ''}<div class="pa"><button data-pl="${id}" class="${voted.has('p' + id) ? 'liked' : ''}"><i class="ic like"></i><span>${fmt(p.likes || 0)}</span></button></div></article>`; };
function renderPosts() {
  const m = $('#main'), list = Object.keys(P).sort((a, b) => (P[b].created || 0) - (P[a].created || 0));
  m.innerHTML = `<div class="phd"><h2 class="fx">Посты</h2><button class="blue pbtn2" id="np">＋ Пост</button></div>` + (list.length ? list.map(postCard).join('') : '<div class="msg">Постов пока нет. Напиши первый!</div>');
  $('#np').onclick = composePost;
}
function composePost() {
  if (!me) return authUI('in');
  if (!(U[me.uid] || {}).channel) return createChannel();
  const p = $('#pf'); let img = '';
  p.innerHTML = `<div class="box wide"><h2 class="fx">Новый пост</h2><textarea id="pxt" class="ptx" rows="5" maxlength="1000" placeholder="О чём расскажешь?"></textarea><div id="pim"></div><label class="avpick"><span class="mut">📷 Добавить фото</span><input type="file" accept="image/*" hidden id="pif"></label><div class="err"></div><button class="blue" id="psv">Опубликовать</button></div>`;
  p.classList.add('on'); p.onclick = e => { if (e.target === p) p.classList.remove('on'); };
  $('#pif').onchange = async e => { const f = e.target.files[0]; if (f) { img = await resizeImg(f, 800); $('#pim').innerHTML = `<img class="pi" src="${img}" alt="">`; } };
  $('#psv').onclick = async () => {
    const text = $('#pxt').value.trim(); if (!text && !img) { p.querySelector('.err').textContent = 'Напишите текст или добавьте фото'; return; }
    try { await set(push(ref(db, 'posts')), {uid: me.uid, text, img, created: Date.now(), likes: 0}); p.classList.remove('on'); toast('Пост опубликован'); go('posts'); }
    catch (e) { p.querySelector('.err').textContent = 'Не удалось: ' + errText(e); }
  };
}

/* ---------- Эфиры (WebRTC, сигналы через Firebase) ---------- */
const RTC = {iceServers: [{urls: 'stun:stun.l.google.com:19302'}, {urls: 'stun:stun1.l.google.com:19302'}]};
let live = null;
const addCand = (pc, c) => pc.remoteDescription ? pc.addIceCandidate(c).catch(() => {}) : (pc._q = pc._q || []).push(c);
const flush = pc => { (pc._q || []).forEach(c => pc.addIceCandidate(c).catch(() => {})); pc._q = []; };
function renderLiveList() {
  if (live) return;
  const m = $('#main'), now = Date.now(), L = Object.keys(LV).filter(i => LV[i].live && now - (LV[i].ping || 0) < 25000);
  m.innerHTML = `<div class="phd"><h2 class="fx">Эфиры</h2><button class="blue pbtn2" id="gl">● В эфир</button></div>` + (L.length ? L.map(i => `<div class="lv" data-l="${i}"><div class="av">${avatarHtml(LV[i].uid)}</div><div class="tx"><b>${esc(LV[i].title)}</b><p>${esc((U[LV[i].uid] || {}).channel || 'Канал')}</p></div><span class="livebadge">LIVE</span></div>`).join('') : '<div class="msg">Сейчас никто не в эфире</div>');
  $('#gl').onclick = startLive;
}
setInterval(() => { if (tab === 'live' && !live) renderLiveList(); }, 10000);
function liveUI(title, role) {
  const o = $('#lv');
  o.innerHTML = `<div class="lvw"><video id="lvv" playsinline autoplay ${role === 'host' ? 'muted' : ''}></video><div class="lvs" id="lvs">${role === 'host' ? '' : 'Подключаемся…'}</div>
  <div class="lvt"><button class="cx2" id="lvx" aria-label="Закрыть"><i class="x"></i></button><span class="livebadge">LIVE</span><span id="lvn">👁 0</span><b class="lvh">${esc(title)}</b></div>
  <div class="lvc"><div id="lch"></div><div class="lvi2"><input id="lci" maxlength="200" placeholder="Сообщение в чат" autocomplete="off"><button id="lcs" aria-label="Отправить">➤</button></div></div></div>`;
  o.classList.add('on');
  $('#lvx').onclick = leaveLive;
  const send = () => {
    const t = $('#lci').value.trim(); if (!t) return; if (!me) return authUI('in');
    $('#lci').value = ''; push(ref(db, `lives/${live.id}/chat`), {n: (U[me.uid] || {}).channel || 'Гость', t, ts: Date.now()}).catch(() => toast('Чат недоступен'));
  };
  $('#lcs').onclick = send; $('#lci').onkeydown = e => { if (e.key === 'Enter') send(); };
  const id = live.id;
  live.offs.push(onChildAdded(query(ref(db, `lives/${id}/chat`), limitToLast(60)), s => {
    const c = s.val(), b = $('#lch'); if (!b) return;
    const d = document.createElement('div'); d.innerHTML = `<b>${esc(c.n)}</b> ${esc(c.t)}`; b.appendChild(d);
    while (b.children.length > 40) b.firstChild.remove(); b.scrollTop = b.scrollHeight;
  }));
  live.offs.push(onValue(ref(db, `lives/${id}/viewers`), s => { const n = $('#lvn'); if (n) n.textContent = '👁 ' + Object.keys(s.val() || {}).length; }));
}
async function startLive() {
  await authReady; if (!me) return authUI('in');
  if (live) return;
  if (!(U[me.uid] || {}).channel) return createChannel();
  const p = $('#pf');
  p.innerHTML = '<div class="box wide"><h2 class="fx">Эфир</h2><input id="lt" maxlength="80" placeholder="Название эфира" value="Мой эфир"><button class="blue" id="lgo">Начать эфир</button></div>';
  p.classList.add('on'); p.onclick = e => { if (e.target === p) p.classList.remove('on'); };
  $('#lgo').onclick = async () => {
    const title = $('#lt').value.trim() || 'Эфир'; p.classList.remove('on');
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'user', width: {ideal: 640}, height: {ideal: 480}, frameRate: {ideal: 24}}, audio: true}); }
    catch (e) { return toast('Нет доступа к камере'); }
    const id = push(ref(db, 'lives')).key, base = ref(db, 'lives/' + id);
    try { await set(base, {uid: me.uid, title, live: true, created: Date.now(), ping: Date.now()}); }
    catch (e) { stream.getTracks().forEach(t => t.stop()); return toast('Эфир не запустился: ' + errText(e), 5000); }
    const dc = onDisconnect(base); dc.remove();
    live = {id, role: 'host', stream, pcs: {}, offs: [], dc};
    liveUI(title, 'host'); $('#lvv').srcObject = stream;
    live.hb = setInterval(() => update(base, {ping: Date.now()}).catch(() => {}), 8000);
    live.offs.push(onChildAdded(ref(db, `lives/${id}/viewers`), s => hostPeer(id, s.key)));
  };
}
async function hostPeer(id, vk) {
  const l = live; if (!l) return;
  const pc = new RTCPeerConnection(RTC); l.pcs[vk] = pc;
  l.stream.getTracks().forEach(t => pc.addTrack(t, l.stream));
  pc.onicecandidate = e => { if (e.candidate) push(ref(db, `lives/${id}/sig/${vk}/hc`), e.candidate.toJSON()); };
  pc.onconnectionstatechange = () => { if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) { try { pc.close(); } catch (e) {} delete l.pcs[vk]; remove(ref(db, `lives/${id}/sig/${vk}`)).catch(() => {}); } };
  await pc.setLocalDescription(await pc.createOffer());
  await set(ref(db, `lives/${id}/sig/${vk}/offer`), {type: pc.localDescription.type, sdp: pc.localDescription.sdp});
  l.offs.push(onValue(ref(db, `lives/${id}/sig/${vk}/answer`), async s => { const a = s.val(); if (a && !pc.currentRemoteDescription && pc.signalingState === 'have-local-offer') { await pc.setRemoteDescription(a); flush(pc); } }));
  l.offs.push(onChildAdded(ref(db, `lives/${id}/sig/${vk}/vc`), s => addCand(pc, s.val())));
}
async function watchLive(id) {
  if (live || !LV[id]) return;
  const vk = 'v' + Math.random().toString(36).slice(2, 10), pc = new RTCPeerConnection(RTC);
  live = {id, role: 'view', pcs: {v: pc}, offs: [], vk};
  liveUI(LV[id].title, 'view');
  pc.ontrack = e => { const v = $('#lvv'); if (v && v.srcObject !== e.streams[0]) { v.srcObject = e.streams[0]; v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }); const s = $('#lvs'); if (s) s.remove(); } };
  pc.onicecandidate = e => { if (e.candidate) push(ref(db, `lives/${id}/sig/${vk}/vc`), e.candidate.toJSON()); };
  live.offs.push(onValue(ref(db, `lives/${id}/live`), s => { if (!s.val()) { toast('Эфир завершён'); leaveLive(); } }));
  live.offs.push(onValue(ref(db, `lives/${id}/sig/${vk}/offer`), async s => {
    const o = s.val(); if (!o || pc.remoteDescription) return;
    await pc.setRemoteDescription(o); flush(pc);
    await pc.setLocalDescription(await pc.createAnswer());
    await set(ref(db, `lives/${id}/sig/${vk}/answer`), {type: pc.localDescription.type, sdp: pc.localDescription.sdp});
  }));
  live.offs.push(onChildAdded(ref(db, `lives/${id}/sig/${vk}/hc`), s => addCand(pc, s.val())));
  try { await set(ref(db, `lives/${id}/viewers/${vk}`), true); }
  catch (e) { toast('Нужно войти, чтобы смотреть эфир'); leaveLive(); }
  setTimeout(() => { const s = $('#lvs'); if (s && live && live.vk === vk) s.textContent = 'Не удаётся подключиться. Попробуйте позже'; }, 15000);
}
function leaveLive() {
  if (!live) return; const l = live; live = null;
  clearInterval(l.hb); l.offs.forEach(f => { try { f(); } catch (e) {} });
  Object.values(l.pcs).forEach(pc => { try { pc.close(); } catch (e) {} });
  if (l.stream) l.stream.getTracks().forEach(t => t.stop());
  if (l.role === 'host') { try { l.dc.cancel(); } catch (e) {} remove(ref(db, 'lives/' + l.id)).catch(() => {}); }
  else { remove(ref(db, `lives/${l.id}/viewers/${l.vk}`)).catch(() => {}); remove(ref(db, `lives/${l.id}/sig/${l.vk}`)).catch(() => {}); }
  const o = $('#lv'); o.classList.remove('on'); o.innerHTML = '';
  if (tab === 'live') renderLiveList();
}
window.addEventListener('pagehide', () => { if (live && live.role === 'host') remove(ref(db, 'lives/' + live.id)).catch(() => {}); });

document.addEventListener('click', e => {
  const l = e.target.closest('[data-l]'); if (l) return watchLive(l.dataset.l);
  const pl = e.target.closest('[data-pl]');
  if (pl) { if (!me) return authUI('in'); const k = 'p' + pl.dataset.pl; if (voted.has(k)) return; voted.add(k); pl.classList.add('liked'); runTransaction(ref(db, `posts/${pl.dataset.pl}/likes`), n => (n || 0) + 1).catch(() => {}); return; }
  const au = e.target.closest('.post .av[data-u]'); if (au) channel(au.dataset.u);
});
</script>
